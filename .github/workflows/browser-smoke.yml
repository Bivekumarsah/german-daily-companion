name: DeutschDaily browser UI smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  chromium-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium browser tools
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Verify mobile-sized viewports and desktop keyboard navigation
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/deutschdaily-http.log 2>&1 &
          sleep 2
          node scripts/browser-smoke.mjs
