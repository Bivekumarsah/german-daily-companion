name: DeutschDaily Safari engine smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  webkit-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright WebKit browser engine
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps webkit
      - name: Verify Safari-engine mobile viewport study experience
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/deutschdaily-http.log 2>&1 &
          sleep 2
          node scripts/webkit-smoke.mjs
