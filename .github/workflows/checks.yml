name: DeutschDaily checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check lessons.js && node --check phrases.js && node --check a1-course-data.js && node --check visual-stories.js && node --check listening-lab.js && node --check visual-lab.js && node --check sentence-builder.js && node --check pronunciation-data.js && node --check pronunciation-lab.js && node --check a1-mock-data.js && node --check a1-mock.js && node --check a1-themes-data.js && node --check a1-themes.js && node --check a1-essentials-data.js && node --check a1-grammar-bridge-data.js && node --check a1-bridge.js && node --check a1-course.js && node --check sw.js
      - run: node --check scripts/export-local-entries.mjs && node scripts/export-local-entries.mjs > /dev/null && python3 -m py_compile scripts/goethe-full-audit.py
      - run: node audit-a1.mjs && node a1-lexical-audit.test.mjs && node test.mjs && node visual-dom.test.mjs && node listening-lab.test.mjs && node sentence-builder.test.mjs && node pronunciation-lab.test.mjs && node pronunciation-mic.test.mjs && node a1-mock.test.mjs && node a1-themes.test.mjs && node a1-bridge.test.mjs
